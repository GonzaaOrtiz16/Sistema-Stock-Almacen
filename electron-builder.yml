appId: com.almacengabriela.pos
productName: Almacén Minimercado Gabriela
copyright: Copyright © 2024 Almacén Gabriela

directories:
  buildResources: build      # aquí va icon.ico para el instalador
  output: C:\Users\Pc\Desktop\almacen-build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

asar: true
asarUnpack:
  - "**/*.node"              # módulos nativos (better-sqlite3, bcrypt)

# ── Windows ────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  # icon: build/icon.ico    # descommentar cuando tengas el .ico (256×256)
  publisherName: Almacén Minimercado Gabriela

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Almacén Gabriela
  installerLanguages:
    - es_AR
  language: 11274            # código LCID para Español Argentina
  # es_AR no tiene traducido MUI_UNTEXT_WELCOME_INFO_TITLE en NSIS 3.0.4.1 →
  # genera el warning 6040 (cosmético). Sin esto, makensis lo trata como error.
  warningsAsErrors: false

# ── Auto-update (GitHub Releases) ─────────────────────────────────────────
# Para publicar una nueva versión:
# 1. Bumpeá "version" en package.json
# 2. Asegurate de tener GH_TOKEN en .env (github.com/settings/tokens → repo)
# 3. Corré: npm run release
publish:
  provider: github
  owner: GonzaaOrtiz16
  repo: Sistema-Stock-Almacen
